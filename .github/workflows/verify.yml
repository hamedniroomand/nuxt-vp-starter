name: Verify

on:
  workflow_call:
    inputs:
      upload-output:
        description: Upload the `.output` directory as the `nuxt-output` artifact.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - name: Check format, lint and TypeScript types
        run: vp check

      - name: Check Vue types
        run: vpr typecheck

      - name: Test
        run: vp test

      - name: Build
        run: vpr build

      - name: Upload build output
        if: inputs.upload-output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuxt-output
          path: .output
          retention-days: 7
